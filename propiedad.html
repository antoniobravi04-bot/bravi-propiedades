  <style>
    .dp { padding: 116px 0 80px; }
    .dp-volver {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: .82rem; margin-bottom: 20px;
      transition: color .2s;
    }
    .dp-volver:hover { color: var(--navy); }

    /* ─ Galería full width ─ */
    .dp-gallery { display: flex; flex-direction: column; gap: 8px; }
    .dp-gallery__hero { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; background: #eee; }
    .dp-gallery__hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dp-gallery__nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.9); border: none; border-radius: 50%;
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.3rem; color: var(--navy);
      box-shadow: 0 2px 8px rgba(0,0,0,.15); transition: background .15s;
    }
    .dp-gallery__nav:hover { background: #fff; }
    .dp-gallery__nav--prev { left: 12px; }
    .dp-gallery__nav--next { right: 12px; }
    .dp-gallery__counter {
      position: absolute; bottom: 10px; right: 14px;
      background: rgba(0,0,0,.48); color: #fff;
      font-size: .75rem; padding: 3px 10px; border-radius: 20px;
    }
    .dp-gallery__thumbs {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
    }
    .dp-gallery__thumbs::-webkit-scrollbar { height: 3px; }
    .dp-gallery__thumbs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .dp-gallery__thumb {
      flex-shrink: 0; width: 72px; height: 50px; object-fit: cover;
      border-radius: 6px; cursor: pointer; opacity: .55;
      border: 2px solid transparent; transition: opacity .2s, border-color .2s;
    }
    .dp-gallery__thumb.active { opacity: 1; border-color: var(--gold); }
    .dp-gallery__thumb:hover { opacity: 1; }

    /* ─ Info bajo galería ─ */
    .dp-desc-block { margin-top: 28px; }
    .dp-section-title {
      font-size: .8rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
    }
    .dp-desc { font-size: 1.05rem; line-height: 1.9; color: var(--text); white-space: pre-line; }
    .dp-specs-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0;
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      margin-top: 4px;
    }
    .dp-specs-grid__item {
      display: flex; flex-direction: column;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      font-size: .88rem;
    }
    .dp-specs-grid__item:nth-child(even) { border-right: none; }
    .dp-specs-grid__item:nth-last-child(-n+2) { border-bottom: none; }
    .dp-specs-grid__label { font-size: .75rem; color: var(--text-muted); margin-bottom: 3px; }
    .dp-specs-grid__value { font-weight: 600; color: var(--navy); }
    #propMap {
      width: 100%; height: 260px; border-radius: 10px; overflow: hidden;
      margin-top: 4px;
    }
    #propMap iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .dp-map-link {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 10px; font-size: .82rem; color: var(--gold); font-weight: 500;
      transition: color .2s;
    }
    .dp-map-link:hover { color: var(--navy); }
    .dp-map-placeholder {
      width: 100%; height: 260px; border-radius: 10px; background: #f0f1f3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; color: var(--text-muted); font-size: .85rem; margin-top: 4px;
    }

    /* ─ Action bar debajo de la galería ─ */
    .dp-action-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      margin: 20px 0 32px;
      overflow: hidden;
    }
    .dp-action-bar__info {
      padding: 20px 24px;
    }
    .dp-action-bar__price {
      font-size: 1.9rem; font-weight: 700; color: var(--navy); line-height: 1.1;
      margin-bottom: 5px;
    }
    .dp-action-bar__loc {
      display: flex; align-items: flex-start; gap: 5px;
      font-size: .82rem; color: var(--text-muted); line-height: 1.4;
    }
    .dp-action-bar__hls {
      display: flex; align-items: center; gap: 0;
      padding: 20px 32px;
      border-left: 1.5px solid var(--border);
      border-right: 1.5px solid var(--border);
      height: 100%;
    }
    .dp-action-bar__hl {
      text-align: center; padding: 0 20px;
      border-right: 1px solid var(--border);
    }
    .dp-action-bar__hl:last-child { border-right: none; }
    .dp-action-bar__hl-val { display: block; font-size: 1.2rem; font-weight: 700; color: var(--navy); }
    .dp-action-bar__hl-lbl { display: block; font-size: .72rem; color: var(--text-muted); margin-top: 2px; }
    .dp-action-bar__btns {
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dp-action-bar__btns .btn { justify-content: center; font-size: .9rem; }
    .dp-card__share {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 16px; width: 100%;
      background: none; border: 1.5px solid var(--border); border-radius: 50px;
      font-size: .82rem; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: border-color .2s, color .2s;
    }
    .dp-card__share:hover { border-color: var(--navy); color: var(--navy); }
    .dp-card__share--copied { border-color: #22c55e !important; color: #22c55e !important; }
    .dp-action-bar__id {
      font-size: .72rem; color: var(--text-muted); margin-top: 4px; text-align: center;
    }

    /* ─ Título encima del grid ─ */
    .dp-header { margin-bottom: 20px; }
    .dp-header__title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      color: var(--navy); margin: 0;
    }

    /* ─ Responsive ─ */
    @media (max-width: 900px) {
      .dp-action-bar {
        grid-template-columns: 1fr;
      }
      .dp-action-bar__hls {
        border-left: none; border-right: none;
        border-top: 1.5px solid var(--border);
        border-bottom: 1.5px solid var(--border);
        padding: 16px 24px; justify-content: flex-start;
      }
      .dp-action-bar__hl { padding: 0 16px; }
      .dp-action-bar__hl:first-child { padding-left: 0; }
    }
    @media (max-width: 500px) {
      .dp-gallery__hero { aspect-ratio: 4/3; }
      .dp-specs-grid { grid-template-columns: 1fr; }
      .dp-specs-grid__item { border-right: none; }
      .dp-specs-grid__item:last-child { border-bottom: none; }
    }


    /* ─ Lightbox ─ */
    .lb {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.95); align-items: center; justify-content: center;
      touch-action: none;
    }
    .lb.open { display: flex; }
    .lb__img {
      max-width: 100%; max-height: 100vh; object-fit: contain;
      user-select: none; pointer-events: none;
    }
    .lb__close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,.15); border: none; border-radius: 50%;
      width: 40px; height: 40px; color: #fff; font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1;
    }
    .lb__nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.15); border: none; border-radius: 50%;
      width: 44px; height: 44px; color: #fff; font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .lb__nav--prev { left: 12px; }
    .lb__nav--next { right: 12px; }
    .lb__counter {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,.7); font-size: .8rem;
    }

    /* ─ Highlights bar con íconos ─ */
    .dp-hl-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #f5f6f8;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .dp-hl-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 72px;
      flex: 1;
    }
    .dp-hl-icon { color: var(--navy); }
    .dp-hl-val  { font-size: 1rem; font-weight: 700; color: var(--navy); }
    .dp-hl-lbl  { font-size: .72rem; color: var(--text-muted); text-align: center; }

    /* ─ Título con ubicación ─ */
    .dp-header__loc {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>

        }

        // Precarga las primeras 4 fotos al cargar la página
        imgs.slice(0, Math.min(4, imgs.length)).forEach((_, i) => preload(i));

        function goTo(i) {
          cur = (i + imgs.length) % imgs.length;
          heroImg.src = netlifyImg(imgs[cur], 1200, 675);
          counter.textContent = `${cur+1} / ${imgs.length}`;
          thumbs.forEach((t,j) => t.classList.toggle('active', j===cur));
          thumbs[cur].scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
          // Precarga la siguiente y la anterior para que estén listas
          preload(cur + 1);
          preload(cur - 1);
        }

        document.getElementById('gPrev').addEventListener('click', () => goTo(cur-1));
        document.getElementById('gNext').addEventListener('click', () => goTo(cur+1));
        thumbs.forEach((t,i) => t.addEventListener('click', () => goTo(i)));

        // ── Lightbox ────────────────────────────────────────────────────────
        const lb       = document.getElementById('dpLightbox');
        const lbImg    = document.getElementById('dpLbImg');
        const lbCtr    = document.getElementById('dpLbCounter');

        function lbGoTo(i) {
          cur = (i + imgs.length) % imgs.length;
          lbImg.src = netlifyImg(imgs[cur], 1920, 1080);
          lbCtr.textContent = `${cur+1} / ${imgs.length}`;
          preload(cur + 1); preload(cur - 1);
        }

        function lbOpen(i) { lbGoTo(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function lbClose()  { lb.classList.remove('open'); document.body.style.overflow = ''; }

        // Abrir al tocar/click la imagen hero
        heroImg.style.cursor = 'zoom-in';
        heroImg.addEventListener('click', () => lbOpen(cur));

        document.getElementById('dpLbClose').addEventListener('click', lbClose);
        document.getElementById('dpLbPrev').addEventListener('click', () => lbGoTo(cur - 1));
        document.getElementById('dpLbNext').addEventListener('click', () => lbGoTo(cur + 1));
        lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });

        // Swipe táctil
        let tsX = 0;
        lb.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, { passive: true });
        lb.addEventListener('touchend',   e => {
          const dx = e.changedTouches[0].clientX - tsX;
          if (Math.abs(dx) > 40) dx < 0 ? lbGoTo(cur + 1) : lbGoTo(cur - 1);
        }, { passive: true });

        // Cerrar con Escape / navegar con flechas del teclado
        document.addEventListener('keydown', e => {
          if (!lb.classList.contains('open')) return;
          if (e.key === 'Escape')     lbClose();
          if (e.key === 'ArrowLeft')  lbGoTo(cur - 1);
          if (e.key === 'ArrowRight') lbGoTo(cur + 1);
        });
      }

      // ── Compartir ────────────────────────────────────────────────────────
      const btnCompartir = document.getElementById('btnCompartir');
      if (btnCompartir) {
        btnCompartir.addEventListener('click', () => {
          const url    = btnCompartir.dataset.url;
          const titulo = btnCompartir.dataset.titulo;
          const reset  = () => {
            btnCompartir.classList.remove('dp-card__share--copied');
            btnCompartir.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Compartir propiedad`;
          };
          if (navigator.share) {
            navigator.share({ title: titulo + ' | Bravi Propiedades', text: 'Mirá esta propiedad en Bravi Propiedades', url }).catch(() => {});
          } else {
            navigator.clipboard.writeText(url).then(() => {
              btnCompartir.classList.add('dp-card__share--copied');
              btnCompartir.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ¡Enlace copiado!`;
              setTimeout(reset, 2500);
            }).catch(() => {});
          }
        });
      }

      // ── Mapa OSM ──────────────────────────────────────────────────────────
      function renderMapa(lat, lon) {
        const mapEl = document.getElementById('propMap');
        if (!mapEl) return;
        const d = 0.006;
        const bbox = `${lon-d},${lat-d},${lon+d},${lat+d}`;
        mapEl.innerHTML = `<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${lat},${lon}" loading="lazy" allowfullscreen title="Ubicación"></iframe>`;
      }

      if (p.lat && p.lon) {
        // Coordenadas GPS directas desde MapaProp — siempre exactas
        renderMapa(p.lat, p.lon);
      } else {
        // Fallback: geocodificación por dirección
        const dirLimpia = (p.direccion || '')
          .replace(/^\s*esq(?:uina)?\.?\s*/i, '')
          .replace(/\s+y\s+/i, ' & ');
        const geoAddr = [dirLimpia || p.direccion, p.ciudad || 'General Rodríguez', 'Buenos Aires', 'Argentina'].filter(Boolean).join(', ');
        fetch(`/api/geocode?q=${encodeURIComponent(geoAddr)}`)
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(results => {
            const mapEl = document.getElementById('propMap');
            if (!mapEl) return;
            if (!results || !results.length) {
              mapEl.innerHTML = `<div class="dp-map-placeholder"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>No se encontró la dirección exacta</div>`;
              return;
            }
            renderMapa(parseFloat(results[0].lat), parseFloat(results[0].lon));
          })
          .catch(() => {
            const mapEl = document.getElementById('propMap');
            if (mapEl) mapEl.innerHTML = `<div class="dp-map-placeholder"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>No se pudo cargar el mapa</div>`;
          });
      }
    });
  </script>

  </script>
