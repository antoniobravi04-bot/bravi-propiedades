[build]
  publish = "."
  functions = "netlify/functions"

[images]
  remote_images = ["https://images\\.mapaprop\\.app/.*", "https://images\\.unsplash\\.com/.*"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "https://www.bravipropiedades.com.ar/*"
  to   = "https://bravipropiedades.com.ar/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirects del sitio viejo (MapaProp) → sitio nuevo

# Páginas internas
[[redirects]]
  from = "/pagina/quienes-somos"
  to = "/#nosotros"
  status = 301

[[redirects]]
  from = "/pagina/contacto"
  to = "/#contacto"
  status = 301

[[redirects]]
  from = "/pagina/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/#contacto"
  status = 301

# /buscar → lo maneja buscar/index.html con JS (lee ?operation=)
[[redirects]]
  from = "/buscar"
  to = "/buscar/"
  status = 301

# Propiedades individuales — solo redirige URLs viejas de MapaProp (con año o número largo al final)
# Las URLs nuevas tipo /propiedad/venta-casa-general-rodriguez-HASH son archivos .html y se sirven directo

[[redirects]]
  from = "/propiedades/alquiler"
  to = "/alquileres.html"
  status = 301

[[redirects]]
  from = "/propiedades/*"
  to = "/ventas.html"
  status = 301

# Mapa
[[redirects]]
  from = "/mapa/"
  to = "/ventas.html"
  status = 301

[[redirects]]
  from = "/mapa"
  to = "/ventas.html"
  status = 301

[[redirects]]
  from = "/mapa-propiedades"
  to = "/ventas.html"
  status = 301

# Destacados
[[redirects]]
  from = "/destacados/"
  to = "/ventas.html"
  status = 301

[[redirects]]
  from = "/destacados"
  to = "/ventas.html"
  status = 301

# Scripts y estilos viejos
[[redirects]]
  from = "/styles/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 301

# Links viejos /p/UUID → nueva URL limpia /propiedad/UUID
[[redirects]]
  from = "/p/:id"
  to   = "/propiedad/:id"
  status = 301

# Favicon — Google busca /favicon.ico en la raíz; lo servimos como rewrite al PNG real
[[redirects]]
  from = "/favicon.ico"
  to   = "/favicon.png"
  status = 200
  force  = true

# favicon.svg sigue accesible pero ahora sirve el PNG real (evita que Google tome el logo viejo)
[[redirects]]
  from = "/favicon.svg"
  to   = "/favicon.png"
  status = 200
  force  = true

# Catch-all: cualquier URL inexistente → página 404 personalizada
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
